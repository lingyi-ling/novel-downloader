# NOTE: do not force -Dfile.encoding=UTF-8 here. The daemon writes the forked
# test worker's classpath into an @args file using its own default charset, while
# the java launcher reads that file with the platform charset (GBK on Chinese
# Windows). A mismatch mangles every non-ASCII path entry (this project lives
# under a Chinese directory) and JVM unit tests fail with ClassNotFoundException.
# Kotlin/XML sources are still read as UTF-8 by their compilers.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
