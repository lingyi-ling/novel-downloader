site_name: NovelDownloader
site_description: "NovelDownloader: A toolkit for downloading and processing novels."
site_author: "lingyi-ling"
repo_name: "novel-downloader"
repo_url: "https://github.com/lingyi-ling/novel-downloader"
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            使用指南: Guide
            安装: Install
            配置: Configuration
            设置项参考: Settings Reference
            处理器参考: Processors Reference
            CLI 用法: CLI Usage
            本地 API 服务: Local API Service
            书源: Book Sources
            文件保存: File Saving
            复制 Cookies: Copy Cookies
            支持站点: Supported Sites
            总览: Overview
            标签: Tags
            参考: Reference
            API 示例: API Examples
            插件: Plugins
            技术笔记: Notes
            AES 笔记: AES Notes
            多看的 EPUB 笔记: Duokan EPUB Notes
            飞卢 Web 笔记: Faloo Web Notes
            轻之文库笔记: Linovelib Notes
            JS IIFE 解析笔记: JS IIFE Parsing Notes
            起点 App 笔记: Qidian App Notes
            起点 Web 笔记: Qidian Web Notes
            西瓜书屋笔记: Xiguashuwu Notes
            其他: Misc
  - search
  - tags
  - privacy:
      assets: false
      links_attr_map:
        target: _blank
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_signature: true
            show_source: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.tasklist
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 使用指南:
    - 安装: guide/installation.md
    - 配置: guide/configuration.md
    - 设置项参考: guide/settings-reference.md
    - 处理器参考: guide/processors-reference.md
    - CLI 用法: guide/cli-examples.md
    - 本地 API 服务: guide/api.md
    - Android 客户端: guide/android-app.md
    - 书源: guide/book-sources.md
    - 文件保存: guide/file-saving.md
    - 复制 Cookies: guide/copy-cookies.md

  - 支持站点:
    - 总览: supported-sites/index.md
    - 标签: supported-sites/tags.md

  - 参考:
    - API 示例: reference/api-examples.md
    - 插件: reference/plugins.md

  - 技术笔记:
    - AES 笔记: notes/aes.md
    - 多看的 EPUB 笔记: notes/duokan_epub.md
    - 飞卢 Web 笔记: notes/faloo_web.md
    - 轻之文库笔记: notes/linovelib.md
    - JS IIFE 解析笔记: notes/parse_js_iife.md
    - 起点 App 笔记: notes/qidian_app.md
    - 起点 Web 笔记: notes/qidian_web.md
    - 西瓜书屋笔记: notes/xiguashuwu.md

  - 其他:
    - TODO: misc/todo.md

not_in_nav: |
  supported-sites/site-details/*

exclude_docs: |
  /data/
