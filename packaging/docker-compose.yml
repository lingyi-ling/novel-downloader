# Docker Compose for the Novel Downloader REST API.
#
# Build the image locally first (the compose file builds it from the repo):
#
#   docker compose -f packaging/docker-compose.yml up -d
#
# The API listens on 127.0.0.1:8081 inside the container; the mapping below
# publishes it on localhost only. Set NOVEL_API_TOKEN to require a token on
# every endpoint (recommended when the port is exposed beyond localhost).

services:
  novel-api:
    build:
      context: ..
      dockerfile: packaging/Dockerfile
    image: novel-downloader-api:local
    container_name: novel-api
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      # NOVEL_API_TOKEN: change-me        # uncomment to require a token
      NOVEL_HOME: /data
    volumes:
      - noveldl-data:/data
    restart: unless-stopped
    healthcheck:
      # Mirror the Dockerfile HEALTHCHECK: /api/v1/health sits behind the
      # token dependency, so the probe must send NOVEL_API_TOKEN when one is
      # configured (otherwise the check 401s and the container is flagged
      # unhealthy even though the API works).
      test: ["CMD", "python", "-c", "import os, urllib.request; token = os.environ.get('NOVEL_API_TOKEN', ''); headers = {'Authorization': 'Bearer ' + token} if token else {}; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8081/api/v1/health', headers=headers), timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  noveldl-data:
