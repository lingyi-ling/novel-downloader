[project]
name = "novel-downloader"
description = "A toolkit for downloading and processing novels."
authors = [
    { name = "lingyi-ling" }
]
license = {file = "LICENSE"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
keywords = [
  "novel",
  "web novel",
  "light novel",
  "crawler",
  "scraper",
  "ebook",
  "epub",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dynamic = ["version"]
dependencies = [
    "rich",
    "requests",
    "pycryptodome",
    "aiohttp",
    "lxml",
    "cssselect",
    "platformdirs",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
]
music = [
    "mutagen",
    "pathvalidate",
    "pillow",
    "qrcode",
    "websocket-client",
]
# Kept for the legacy desktop GUI (legacy/music_desktop/gui.py), which lives
# outside the package and needs customtkinter to run.
music-desktop = [
    "customtkinter",
    "mutagen",
    "pathvalidate",
    "pillow",
    "qrcode",
    "websocket-client",
]
image-utils = [
    "brotli",
    "numpy",
    "fonttools",
    "pillow",
]
httpx = [
    "httpx[http2]",
]
curl_cffi = [
    "curl_cffi",
]
all-backends = [
    "httpx[http2]",
    "curl_cffi",
]
all = [
    "fastapi",
    "uvicorn",
    "brotli",
    "numpy",
    "fonttools",
    "pillow",
    "httpx[http2]",
    "curl_cffi",
    "mutagen",
    "qrcode",
    "websocket-client",
]

docs = [
    "mkdocs-material",
    "mkdocs-static-i18n",
    "mkdocstrings",
    "mkdocstrings-python",
]
tests = [
    "babel",
    "brotli",
    "numpy",
    "fonttools",
    "pillow",
    "fastapi",
    "httpx[http2]",
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
    "pytest-cov",
    "pytest-mock",
    "types-requests",
    "types-lxml",
]
ci = [
    "babel",
    "brotli",
    "numpy",
    "fonttools",
    "pillow",
    "curl_cffi",
    "httpx[http2]",
    "fastapi",
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
    "pytest-cov",
    "pytest-mock",
    "types-requests",
    "types-lxml",
    "mypy",
    "ruff",
    "pre-commit",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
    "pytest-cov",
    "pytest-mock",
    "types-requests",
    "types-lxml",
    "mypy",
    "ruff",
    "pre-commit",
    "commitizen",
    "babel",
    # "genbadge[all]",
]

[project.scripts]
novel-cli = "novel_downloader.apps.cli.main:cli_main"
novel-api = "novel_downloader.apps.api.main:api_main"
novel-desktop = "novel_downloader.apps.desktop.main:desktop_main"

[project.urls]
Homepage = "https://github.com/lingyi-ling/novel-downloader"
Source = "https://github.com/lingyi-ling/novel-downloader"
Issues = "https://github.com/lingyi-ling/novel-downloader/issues"

[build-system]
requires = ["setuptools>=61.0", "babel>=2.12"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["novel_downloader", "novel_downloader.*"]

[tool.setuptools.package-data]
"novel_downloader" = ["py.typed"]
"novel_downloader.resources.config" = ["*.toml"]
"novel_downloader.resources.text" = ["*.txt"]
"novel_downloader.resources.scripts" = ["*.js"]
"novel_downloader.resources.json" = ["*.json"]
"novel_downloader.resources.styles" = ["*.css"]
"novel_downloader.resources.icons" = ["*.ico", "*.png"]
"novel_downloader.locales" = ["*/LC_MESSAGES/*.mo", "*/LC_MESSAGES/*.po"]
"novel_downloader.plugins.rule.builtin" = ["*.json"]
"novel_downloader.apps.music.providers._vendor.musicdl" = ["SOURCE.txt"]

[tool.setuptools.dynamic]
version = {attr = "novel_downloader.__version__"}

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"
# Vendored third-party code is kept byte-for-byte close to upstream.
exclude = ["src/novel_downloader/apps/music/providers/_vendor"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle (error)
    "F",  # pyflakes
    "B",  # bugbear
    "C4", # flake8-comprehensions
    "I",  # isort
    "UP", # pyupgrade
    "SIM" # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

# ``np.bitwise_and.reduce(...)`` is valid at runtime but the NumPy stubs only
# expose the two-argument overload, which trips ``call-overload`` under strict.
[[tool.mypy.overrides]]
module = "novel_downloader.libs.image_utils"
disable_error_code = ["call-overload"]

# The music engine was merged from a standalone tool written without type
# annotations; it is relaxed here while annotations are added incrementally.
# Only the still-untyped modules are relaxed. mypy matches per-module patterns
# with fnmatch globs (no regex alternation), so each module is listed, and the
# bare "providers" entry keeps the untyped providers/__init__.py relaxed too.
[[tool.mypy.overrides]]
module = [
    "novel_downloader.apps.music.weapi",
    "novel_downloader.apps.music.downloader",
    "novel_downloader.apps.music.browser_login",
    "novel_downloader.apps.music.providers",
    "novel_downloader.apps.music.providers.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["var-annotated", "type-arg"]

# Vendored musicdl (upstream code) is not type-checked.
[[tool.mypy.overrides]]
module = "novel_downloader.apps.music.providers._vendor.*"
ignore_errors = true

# Fully annotated music modules are checked at full strictness. This later
# section re-enables the options the relaxed music rules above turn off.
[[tool.mypy.overrides]]
module = [
    "novel_downloader.apps.music",
    "novel_downloader.apps.music.paths",
    "novel_downloader.apps.music.settings",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
enable_error_code = ["var-annotated", "type-arg"]

# providers/health.py is fully annotated too, but it calls ``create()`` from
# the still-untyped providers registry, so ``disallow_untyped_calls`` stays
# off for it until that module gains annotations.
[[tool.mypy.overrides]]
module = "novel_downloader.apps.music.providers.health"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
enable_error_code = ["var-annotated", "type-arg"]

[tool.pytest.ini_options]
minversion = "7.1"
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "src/novel_downloader/plugins/sites/*",
  "src/novel_downloader/plugins/archived/*",
  "src/novel_downloader/__main__.py",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.0"
version_files = [
    "src/novel_downloader/__init__.py"
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
tag_format = "v$version"
bump_message = "chore(release): bump version to $new_version"
