name: Security scan

# Weekly, read-only audit of both the working tree and the full commit
# history.  The scanner (scripts/scan_secrets.py) prints only path:line:rule
# and never the matched value, so this log cannot turn into the leak the
# check exists to prevent.  A finding exits non-zero and fails the job; the
# JSON reports are uploaded as an artifact for triage.
on:
  schedule:
    # Mondays at 03:17 UTC.  GitHub pauses scheduled workflows after 60 days
    # without repository activity, so workflow_dispatch is the manual fallback.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One constant group: a weekly run and a manual dispatch must not scan the
  # same history at once.  Never cancel in flight -- a second trigger queues
  # instead of killing a scan that is already halfway through the log.
  group: security-scan
  cancel-in-progress: false

env:
  # Kept in sync with the Chaquopy pin in android/app/build.gradle.kts and the
  # other workflows (tests/test_workflow_contract.py enforces this).
  PYTHON_VERSION: "3.12"

jobs:
  scan:
    name: Scan working tree and history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # --history walks every commit ever pushed, so the checkout cannot
          # be shallow (a depth-1 clone would report zero findings).
          fetch-depth: 0
          # Nothing here writes; keep the workflow token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan working tree and history
        # Both scans always run so one failing report does not hide the other;
        # the exit status is still propagated, so a finding fails the job.
        # --json goes to a file and is never echoed to the log.
        run: |
          status=0
          python scripts/scan_secrets.py --json > security-workspace.json || status=1
          python scripts/scan_secrets.py --history --json > security-history.json || status=1
          exit "$status"
      - name: Upload scan reports
        # Always upload: a failing scan is exactly when the report matters.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-reports
          path: |
            security-workspace.json
            security-history.json
          if-no-files-found: error
          retention-days: 30
