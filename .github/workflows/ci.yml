name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Keep these in sync with .pre-commit-config.yaml
  # (ruff-pre-commit / mirrors-mypy) and with the local toolchain.
  RUFF_VERSION: "0.17.1"
  MYPY_VERSION: "2.4.0"
  # Python sources only. `ruff check .` / `ruff format .` would also walk
  # legacy/ (an archived snapshot that predates these gates) and, since ruff
  # 0.17, Python code blocks inside README/docs markdown files.
  LINT_PATHS: "src tests scripts packaging setup.py"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; keep the workflow token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check $LINT_PATHS
      - name: ruff format --check
        run: ruff format --check $LINT_PATHS

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; keep the workflow token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci,api,music]" "mypy==${MYPY_VERSION}"
      - name: mypy (package sources)
        run: mypy src
      - name: mypy (build chain + packaging specs)
        # The build/release scripts and the PyInstaller specs run on every
        # release, so they are held to the same strict gate as src/.  The rest
        # of scripts/ (one-off data tools) and tests/ predate the gate and are
        # not type-checked yet.
        run: >-
          mypy packaging
          scripts/build_cli.py scripts/build_desktop.py scripts/build_release.py
          scripts/check_versions.py scripts/verify_frozen.py
          scripts/update_pot.py scripts/update_po.py scripts/compile_mo.py
          scripts/release.py

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; keep the workflow token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check version sources agree
        # stdlib only: the package version, the Android versionName, the
        # pyproject dynamic attribute and (when a local build exists) the
        # generated latest.json.  A drift here disables Android updates.
        run: python scripts/check_versions.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; keep the workflow token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # ``pyyaml`` is listed explicitly because tests/test_packaging_scripts.py
        # parses the workflow files; without it those contracts would be
        # silently skipped instead of failing.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci,api,music]" pyyaml
      - name: pytest
        run: pytest -q

  translations:
    name: Translations up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes; keep the workflow token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install babel
        # Pinned: the job diffs Babel's exact output against the committed
        # catalogs, so an unpinned release could turn a formatting change into
        # a spurious failure.
        run: |
          python -m pip install --upgrade pip
          pip install "babel==2.18.0"
      - name: Regenerate catalogs
        run: |
          python scripts/update_pot.py
          python scripts/update_po.py
      - name: Fail if catalogs are stale
        # `git diff` only reports tracked files, so a newly generated catalog
        # (a new locale, or a renamed file) would pass silently.  `git status`
        # covers modified and untracked paths alike.
        run: |
          git diff --exit-code -- src/novel_downloader/locales
          stale="$(git status --porcelain -- src/novel_downloader/locales)"
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale"
            echo "::error::locale catalogs are stale; run scripts/update_pot.py and scripts/update_po.py"
            exit 1
          fi

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Kotlin changes ship inside the APK and have no other CI coverage, so a
    # regression here must block: the first runs confirmed the runner has
    # everything the Chaquopy plugin needs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        # Chaquopy's buildPython must match android/app/build.gradle.kts
        # (``version = "3.12"``). Without this step the job relies on whatever
        # Python the runner image happens to put on PATH.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Gradle must be able to resolve compileSdk 35 (AGP 8.6.1 defaults
          # to build-tools 34.0.0, so both are installed). Licences are
          # accepted non-interactively; logging is disabled to keep the job log
          # free of SDK licence text.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 build-tools;34.0.0"
          accept-android-sdk-licenses: "yes"
          log-accepted-android-sdk-licenses: "false"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain
